[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "as2expert"
version = "0.1.0"
description = "Official Python client for the AS2Expert REST API (send/receive AS2/EDI, manage partners, certificates, stations)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "AS2Expert" }]
keywords = ["as2", "edi", "edifact", "b2b", "as2expert"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/as2expert/as2expert-python"
Source = "https://github.com/as2expert/as2expert-python"

[project.optional-dependencies]
dev = ["pytest>=7", "responses>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
as2expert = ["py.typed"]
